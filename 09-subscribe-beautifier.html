<html>
    <head>
           <title>
           subscribe beautifyier
           </title>
    </head>
    <body>
                 <p> Youtube subscribe button</p>
                 <button class='js-button-sub sub-button' onclick="subscribe()">Subscribe</button>
                <style>
                    .sub-button{
                        border: none;
                        background-color: black;
                        color: white;
                        padding: 10px 15px 10px 15px;
                        border-radius:  50px;
                        font-weight: bold; 
                    }

                    .issub-button{
                        border: none;
                        background-color: rgb(240,240,240);
                        color: black;
                        padding: 10px 15px 10px 15px;
                        border-radius:  50px;
                        cursor: pointer;
                        font-weight: bold;                    }
                        body{
                            font-family: Arial;
                            padding: 10px 10px 10px 30px;
                            
                        }
                </style>
                 <script>
                    
                function subscribe(){
                   const bqs = document.querySelector('.js-button-sub');
                   console.log('inside method');
                   if(bqs.innerText === 'Subscribe'){
                     bqs.innerHTML = 'Subscribed';
                     bqs.classList.add('issub-button');

                     }else if(bqs.innerText === 'Subscribed'){
                        console.log('inside else if');
                        bqs.innerHTML = 'Subscribe';
                        bqs.classList.remove('issub-button');

                        console.log(document.querySelector('.js-button-sub'));
                    
                     }
                    }
                 </script>
    </body>
</html>
