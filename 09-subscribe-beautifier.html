<html>
    <head>
           <title>
           subscribe beautifyier
           </title>
    </head>
    <body>
                 <p> Youtube subscribe button</p>
                 <button class='js-button-sub sub-button' onclick="subscribe()">Subscribe</button>
                <style>
                    .sub-button{
                        border: none;
                        background-color: black;
                        color: white;
                        padding: 10px 15px 10px 15px;
                        border-radius:  50px;
                        font-weight: bold; 
                    }

                    .issub-button{
                        border: none;
                        background-color: gray;
                        color: black;
                        padding: 10px 15px 10px 15px;
                        border-radius:  50px;
                        cursor: pointer;
                        font-weight: bold;                    }
                </style>
                 <script>
                    
                function subscribe(){
                   const bqs = document.querySelector('.js-button-sub');
                   console.log('inside method');
                   if(bqs.innerText === 'Subscribe'){
                     bqs.innerHTML = 'Subscribed';
                     bqs.classList ="issub-button";

                     }else{
                        bqs.innerHTML = 'Subscribe'
                     }
                    }
                 </script>
    </body>
</html>
