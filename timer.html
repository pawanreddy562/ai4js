<!DOCTYPE html>
<html>
<header>
<title>Timer</title>
</header>
<body>
    <button onclick="TimerOn()">Timer On</button>
    <button onclick="TimerOff()">Timer Off</button>
    <p class="js-timer"></p>
    <script>
        let time ='';
        function TimerOn(){
             time = setInterval(() => {

                                var currentdate = new Date(); 
                var datetime = "Last Sync: " + currentdate.getDate() + "/"
                                + (currentdate.getMonth()+1)  + "/" 
                                + currentdate.getFullYear() + " @ "  
                                + currentdate.getHours() + ":"  
                                + currentdate.getMinutes() + ":" 
                                + currentdate.getSeconds();
              document.querySelector(".js-timer").innerHTML=datetime;

              //return Date.now();  
            }, 1000);
        }
        function TimerOff(){
            clearInterval(time);
        }
    </script>

</body>
</html>
