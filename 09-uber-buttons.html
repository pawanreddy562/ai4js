<!DOCTYPE html>
<html>
    <head>
        <title>Amazon button</title>
       <style>
        .request-button{
            background-color: black;
            color:white;
            font-size: 20px;
            font-weight: bold;
            padding: 15px 25px ;
            border-radius: 10px;
            margin-right: 15px;
        }
        .Schedule-later-button{
            background-color: rgb(230,230,230);;
            color: black;
            font-size: 20px;
            font-weight: bold;
            padding: 15px 25px ;
            border-radius: 10px;
            border-color: transparent;
            margin-left: 15px ;
          
        }
       </style>
        
    </head>
    <body>
        <button class="request-button"> Request now</button>
        <button class="Schedule-later-button"> Schedule for later</button>
    </body>
</html>
